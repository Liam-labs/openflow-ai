# Security updates are switched on in the repository settings. This file adds a weekly check for ordinary updates, grouped so that
# one pull request covers a week's minor and patch changes. A major version is its own pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # A major version changes how the code must be written, so it is done by hand in its own pull request, not opened for us.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Node moves to a new release line only by a decision (the image follows the long-term-support line).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
