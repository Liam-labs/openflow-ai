name: Checks
# Typecheck, lint (changed files), unit tests, a links and private-strings check of the public Markdown files, a check of outbound web addresses, and a secret scan. A pull request merges only when this passes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint the files this change touches
        # The whole tree still has lint errors from before this check existed. New and changed files must be clean.
        # A branch named export/* (the export from DevFlow) touches hundreds of old files, so there lint only reports.
        # A push to main re-lints what the squash merge brought in, so it only reports too: the pull request already had the blocking run.
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' | tr '\n' ' ')
          if [ -z "$files" ]; then echo "No lintable files changed."; exit 0; fi
          if [ "$EVENT" = push ]; then
            npx eslint $files || echo "::warning::Lint errors after a merge are reported, not blocking. The pull request was the gate."
            exit 0
          fi
          case "$BRANCH" in
            export/*)
              npx eslint $files || echo "::warning::Lint errors on an export branch are reported, not blocking."
              ;;
            *)
              npx eslint $files
              ;;
          esac
      - name: Unit tests
        # tests/known-failing.txt lists files that already failed before this check. A new failure fails the job.
        env:
          NODE_ENV: test
        run: |
          args=$(grep -v '^#' tests/known-failing.txt | grep -v '^$' | sed 's/^/--exclude /' | tr '\n' ' ')
          npx vitest run --maxWorkers=2 $args
      - name: Public docs (links and private strings)
        run: python3 -I scripts/check-public-docs.py
      - name: Web addresses in style sheets, HTML and JSON
        run: python3 -I scripts/check-outbound-assets.py
      - name: Hosts the source can contact
        run: python3 scripts/security-outbound.py . --fail-on-new
      - name: Secret scan
        # gitleaks, pinned and checked against its published checksum. It scans only the commits this change adds, from the
        # merge base with main to HEAD. (The ready-made action built its range from the push event and broke on a rebased branch.)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          version=8.30.1
          sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "$sum  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            git fetch -q origin main
            range="$(git merge-base origin/main HEAD)..HEAD"
          fi
          echo "Scanning $range"
          "$RUNNER_TEMP/gitleaks" detect --redact --no-banner --log-opts="$range"
