name: Container install
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        # amd64 is Intel Macs and most PCs; arm64 is Apple Silicon Macs (the same image, built for arm)
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: docker/smoke-test.sh
      - name: Fresh server-mode install
        run: docker/vps-verify.sh openflow-ai:local "$GITHUB_SHA" server-install-result.json
      - name: Save server-mode result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-install-${{ matrix.runner }}
          path: server-install-result.json
          if-no-files-found: ignore
